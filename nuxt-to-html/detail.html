<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容详情 - 盐城工学院 · 2026年国家教学成果申报</title>

  <!-- 1. Tailwind CSS（本地构建版，提供 header/footer 颜色/字重等工具类） -->
  <link rel="stylesheet" href="style/tailwind.css">
  <!-- 2. CMS 原始样式（.main / .wape-left / .kuaiXun 等内容区依赖此文件） -->
  <link rel="stylesheet" href="style/style.css" type="text/css" media="all">
  <!-- 3. 自定义样式（导航 / footer / ycit-* 无层布局类 / 动画等） -->
  <link rel="stylesheet" href="style/page.css">
  <!-- Lucide Icons（本地） -->
  <script src="js/lucide.min.js"></script>

  <!--
    列表/详情页兼容补丁（内联 <style> 优先级最高）：
    ① style.css "* { margin:0; padding:0 }" 是无层 CSS，优先级高于 Tailwind @layer utilities，
       导致 mx-auto / px-6 等失效 → 已在 page.css 中定义 ycit-* 无层布局类替代
    ② style.css 把 body 字体设为 Microsoft YaHei → #site-header / .ycit-footer 已隔离
    ③ 详情页内容区图片/段落样式恢复
  -->
  <style>
    /* ── 恢复 .main 内 CMS 内容区原始样式 ── */
    .main, .main1 {
      font-family: "Microsoft YaHei", arial, verdana, sans-serif;
      font-size: 14px;
      color: #666;
    }
    .main img { display: inline !important; max-width: 100%; height: auto; }
    .main .kuaiXun-con p { text-indent: 2em; line-height: 1.8em; padding-bottom: 16px; }
    .main .kuaiXun-con img { max-width: 100%; height: auto; }

    /* ── 入场动画 ── */
    [data-sr]{opacity:0;transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1)}
    [data-sr="up"]{transform:translateY(20px)}
    [data-sr="left"]{transform:translateX(-20px)}
    [data-sr].sr-visible{opacity:1;transform:none}
  </style>
</head>

<!--
  body 用 style="" 内联而非 Tailwind 类，避免 flex/min-height 被层叠干扰
-->
<body style="min-height:100vh;display:flex;flex-direction:column;background:#fff;">

  <!-- ════════════════════════════════════════════
       Header — 与首页完全一致
       ════════════════════════════════════════════ -->
  <header id="site-header" class="sticky top-0 z-50 shadow-md">
    <div class="bg-[#B01C1C]">
      <div class="ycit-container ycit-header-row">

        <!-- Logo 占位（替换为学校实际 logo 图片即可） -->
        <a href="index.html" class="flex items-center gap-3 flex-shrink-0 mr-8 group logo-link">
          <div class="w-9 h-9 rounded-sm bg-white/20 border border-white/30 flex items-center justify-center flex-shrink-0">
            <i data-lucide="graduation-cap" class="text-white w-5 h-5"></i>
          </div>
          <!-- ↑ 替换为：<img src="logo.png" alt="盐城工学院" class="h-9 w-auto"> -->
          <div class="leading-tight hidden sm:block">
            <div class="text-white/60 text-[10px] tracking-widest uppercase">Yancheng Institute of Technology</div>
            <div class="text-white font-bold text-sm tracking-wide leading-none">2026年国家教学成果申报</div>
          </div>
        </a>

        <!-- 桌面导航（CMS 渲染 .nav > ul > li 结构） -->
        <nav class="hidden lg:block flex-1" id="desktop-nav">
          <!--#begineditable "网站导航" name="网站导航" viewid="1128427" tagname="网站导航" contype="" stylesysid="" clone="0"-->elementname<!--#endeditable-->
        </nav>

        <!-- 右侧信息 -->
        <div class="hidden lg:flex items-center gap-4 ml-auto flex-shrink-0">
          <span class="text-white/50 text-xs border-r border-white/20 pr-4">盐城工学院</span>
          <a href="index.html" class="flex items-center gap-1.5 text-xs transition-colors"
             style="color:rgba(255,255,255,0.55);text-decoration:none;"
             onmouseover="this.style.color='rgba(255,255,255,0.9)'"
             onmouseout="this.style.color='rgba(255,255,255,0.55)'">
            <i data-lucide="house" style="width:12px;height:12px;flex-shrink:0;"></i>
            首页
          </a>
        </div>

        <!-- 移动端汉堡按钮 -->
        <button class="lg:hidden ml-auto text-white/85 hover:text-white p-1 transition-colors" id="mobile-menu-btn" aria-label="打开菜单">
          <i data-lucide="menu" class="w-6 h-6" id="menu-icon"></i>
        </button>
      </div>
    </div>

    <!-- 移动端下拉菜单 -->
    <div class="lg:hidden bg-white border-t-2 border-[#C9A84C] shadow-xl" id="mobile-menu" style="max-height:0;overflow:hidden;transition:max-height 0.28s ease;">
      <div class="mobile-nav-content" style="padding-top:0.5rem;padding-bottom:0.5rem;">
        <a href="index.html" class="flex items-center gap-2 text-sm font-medium text-[#B01C1C] border-b border-gray-100"
           style="padding:0.875rem 1.5rem;">

        <!--#begineditable "网站导航" name="网站导航" viewid="1128427" tagname="网站导航" contype="" stylesysid="" clone="0"-->elementname<!--#endeditable-->
      </div>
    </div>
  </header>


  <!-- ════════════════════════════════════════════

      <!--#begineditable name="内容页-当前位置" viewid="1128421" tagname="内容页-当前位置" action="" layout="" contype="" stylesysid="" template="" tplstyle="" clone="" istemp=""-->elementname<!--#endeditable-->

  </div>


  <!-- ════════════════════════════════════════════

       flex:1 确保 footer 始终在页面底部

    <div class="main cl">

        <div><!--#begineditable name="栏目名称" viewid="1128464" tagname="栏目名称" action="" layout="" contype="" stylesysid="" template="" tplstyle="" clone="" istemp=""-->elementname<!--#endeditable--></div>

      <div class="wape-right">

    <div class="ycit-container ycit-footer-body">

        <!-- 品牌 -->

            <div class="w-7 h-7 rounded-sm bg-[#C9A84C] flex items-center justify-center flex-shrink-0">

              <span style="font-size:12px;">邮编：224051</span>
            </li>
          </ul>
        </div>

    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.2);">
      <div class="ycit-container ycit-footer-bar" style="font-size:12px;color:rgba(254,202,202,1);">
        <span>盐城工学院版权所有 &nbsp;苏ICP备11037185号-1</span>
        <span>技术支持：教务处信息化建设团队</span>
      </div>
    </div>

  </footer>


  <!-- ════════════════════════════════════════════
       脚本
       ════════════════════════════════════════════ -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) lucide.createIcons();

  <script src="js/page.js"></script>
